name: Build and Release AssureSky

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=OWM_API_KEY=${{ secrets.OWM_API_KEY }} \
            --dart-define=NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/AssureSky-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/AssureSky-android.apk

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=OWM_API_KEY=${{ secrets.OWM_API_KEY }} \
            --dart-define=NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}

      - name: Zip web bundle
        run: |
          mkdir -p artifacts
          cd build/web
          zip -r ../../artifacts/AssureSky-web.zip .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: artifacts/AssureSky-web.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-web]
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: artifacts/

      - name: Generate release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "AssureSky ${{ steps.tag.outputs.tag }}"
          body: |
            ## Download AssureSky

            | Platform | File |
            |----------|------|
            | Android  | `AssureSky-android.apk` |
            | Web      | `AssureSky-web.zip` |

            ### Android Installation
            1. Download `AssureSky-android.apk`
            2. Enable **Install from unknown sources** in Android settings
            3. Open the APK to install

            ### Web
            Unzip `AssureSky-web.zip` and serve with any static host.

            Built from commit `${{ github.sha }}`
          files: |
            artifacts/AssureSky-android.apk
            artifacts/AssureSky-web.zip
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
